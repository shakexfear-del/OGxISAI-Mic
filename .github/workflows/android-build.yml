
name: Build OGxISAI Mic APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          ls -lah
          unzip -l OGxISAI-Mic-Android-Project.zip | head -50

      - name: Extract project
        run: |
          mkdir android-project
          unzip -q OGxISAI-Mic-Android-Project.zip -d android-project
          find android-project -maxdepth 3 -type f | head -100

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd android-project
          find . -name gradlew -type f -print
